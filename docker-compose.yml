version: '3.3'

networks:
  back-tier:
    external: true

services:
  web_portal:
    stdin_open: true
    restart: always
    container_name: anguka_portal
    networks:
      - back-tier
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - '.:/app'
      - '/app/node_modules'
    ports:
      - 1612:1216
    environment:
      - CHOKIDAR_USEPOLLING=true
