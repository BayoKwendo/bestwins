# `version:` is obsolete in Compose v2 and is intentionally omitted.

networks:
  back-tier:
    external: true

services:
  # Production: nginx serving the built bundle. Published on 1616 as before.
  web_portal:
    container_name: besn
    restart: always
    networks:
      - back-tier
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "1616:80"
